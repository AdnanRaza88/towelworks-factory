name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install and build web
        run: |
          npm install
          npm test
          npm run build

      - name: Add Capacitor Android project
        run: npx cap add android

      - name: Grant microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          perm = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if "RECORD_AUDIO" not in text:
              text = text.replace("<application", perm + "    <application", 1)
              p.write_text(text)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TowelWorks-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
